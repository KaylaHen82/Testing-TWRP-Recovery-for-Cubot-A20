name: Build TWRP for Cubot A20

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout device tree
        uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison gperf build-essential \
            zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z-dev ccache \
            libgl1-mesa-dev libxml2-utils xsltproc unzip openjdk-8-jdk openjdk-11-jdk python3 \
            rsync imagemagick

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Init and sync TWRP manifest
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: Copy Cubot A20 device tree
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp/device/Cubot"
          cp -r "$GITHUB_WORKSPACE/device/Cubot/A20" "$GITHUB_WORKSPACE/twrp/device/Cubot/A20"

      - name: Apply Unisoc TWRP source patches
        run: |
          cd "$GITHUB_WORKSPACE/twrp/device/Cubot/A20/prebuilt/sourcecode"
          chmod +x patch.sh recovery.sh
          ./patch.sh

      - name: Build TWRP
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          source build/envsetup.sh
          lunch twrp_A20-eng
          mka recoveryimage -j$(nproc) || true
          mka vendorbootimage -j$(nproc) || true
          echo "=== BUILT IMAGES ==="
          ls -la out/target/product/A20/*.img || true

      - name: Upload TWRP images
        uses: actions/upload-artifact@v4
        with:
          name: A20-twrp
          path: |
            ${{ github.workspace }}/twrp/out/target/product/A20/*.img
          if-no-files-found: error
